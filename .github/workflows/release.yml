name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # debian bookworm is out of reach (gcc 12).
          - image: ubuntu:24.04
            generator: DEB
            name: deb
            runner: ubuntu-latest
          - image: ubuntu:24.04
            generator: DEB
            name: deb-arm64
            runner: ubuntu-24.04-arm
          - image: fedora:latest
            generator: RPM
            name: rpm
            runner: ubuntu-latest
          - image: fedora:latest
            generator: RPM
            name: rpm-arm64
            runner: ubuntu-24.04-arm
          # archlinux has no arm64 image.
          - image: archlinux:base-devel
            generator: TGZ
            name: tgz
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: bootstrap git
        run: |
          . /etc/os-release
          case ${ID_LIKE:-$ID} in
            *arch*)        pacman -Sy --noconfirm --needed git ;;
            *fedora*)      dnf install -y git ;;
            *debian*|*ubuntu*) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: dependencies
        run: ./scripts/ci-deps.sh

      - name: build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: unit tests
        run: ctest --test-dir build/release --output-on-failure

      - name: package
        run: cd build/release && cpack -G ${{ matrix.generator }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/release/*.deb
            build/release/*.rpm
            build/release/*.tar.gz
          if-no-files-found: error

  appimage:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # oldest glibc tether supports
    container: ubuntu:24.04
    steps:
      - name: bootstrap git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: dependencies
        run: |
          ./scripts/ci-deps.sh
          apt-get install -y --no-install-recommends bluez patchelf librsvg2-common desktop-file-utils dpkg-dev

      - name: build
        run: ./packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.runner }}
          path: build/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ca-certificates

      - name: build
        run: ./packaging/flatpak/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.runner }}
          path: build/flatpak/*.flatpak
          if-no-files-found: error

  release:
    needs: [package, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG" --generate-notes
          fi
